<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iSince - 前回いつやったか記録</title>
<style>
  :root{
    --bg:#f5f5f3;
    --surface:#ffffff;
    --border:#e2e1dc;
    --border-strong:#cfcec7;
    --text:#2a2a26;
    --text-muted:#7a7972;
    --text-faint:#a3a29a;
    --accent:#2f6f5e;
    --accent-soft:#e6efec;
    --warn:#9a5b23;
    --warn-soft:#f5ece0;
    --danger:#b3432f;
    --danger-soft:#fbeae6;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Hiragino Sans,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .app{
    max-width:1600px;
    margin:0 auto;
    padding:20px 32px 80px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .brand{
    font-size:17px;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--text);
  }
  .toolbar-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  select, input, textarea, button{
    font-family:inherit;
    font-size:14px;
  }
  select{
    padding:7px 10px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
  }
  .btn{
    padding:8px 14px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
  }
  .btn:hover{ border-color:var(--text-faint); }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn-primary:hover{ background:#265d4e; }
  .btn-text{
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    padding:6px 8px;
    border-radius:var(--radius-sm);
  }
  .btn-text:hover{ background:var(--border); color:var(--text); }
  .btn-danger-text{
    background:none;
    border:none;
    color:var(--danger);
    cursor:pointer;
    padding:6px 8px;
    border-radius:var(--radius-sm);
  }
  .btn-danger-text:hover{ background:var(--danger-soft); }
  .backup-restore-group{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .toolbar-divider{
    width:1px;
    height:20px;
    background:var(--border);
    margin:0 2px;
    flex-shrink:0;
  }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--text-muted);
  }
  .empty-state h2{
    font-size:16px;
    color:var(--text);
    margin:0 0 12px;
  }
  .empty-state p{
    margin:0 0 24px;
    white-space:pre-line;
    font-size:14px;
  }

  /* ---------- Card grid ---------- */
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    align-items:start;
    gap:14px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:pointer;
  }
  .card:hover{ border-color:var(--border-strong); }
  .card-name{
    font-size:15px;
    font-weight:700;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card-main{
    text-align:center;
    padding:4px 0 0;
  }
  .elapsed-num{
    font-size:44px;
    font-weight:800;
    color:var(--accent);
    line-height:1;
    letter-spacing:-0.01em;
  }
  .elapsed-num .unit{
    font-size:20px;
    font-weight:700;
    margin-left:2px;
  }
  .elapsed-label{
    font-size:12px;
    color:var(--text-muted);
    margin-top:3px;
  }
  .elapsed-empty{
    font-size:14px;
    color:var(--text-faint);
    padding:6px 0;
  }
  .compare-text{
    font-size:12px;
    color:var(--warn);
    background:var(--warn-soft);
    display:inline-block;
    padding:3px 9px;
    border-radius:100px;
    margin-top:6px;
  }
  .card-meta{
    font-size:12.5px;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .card-memo{
    color:var(--text-faint);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-top:1px;
  }
  .record-btn{
    margin-top:0;
    width:100%;
    padding:8px 10px;
    border-radius:var(--radius-sm);
    border:1px solid var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:600;
    cursor:pointer;
  }
  .record-btn:hover{ background:#d9e9e3; }

  /* ---------- Detail view ---------- */
  .detail-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .detail-title-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .detail-title{
    font-size:20px;
    font-weight:700;
    margin:0;
  }
  .back-link{
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    font-size:13px;
    padding:4px 0;
    margin-bottom:10px;
  }
  .back-link:hover{ color:var(--text); }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:24px;
  }
  .stat-box{
    background:var(--surface);
    padding:14px 16px;
  }
  .stat-box .stat-label{
    font-size:11.5px;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .stat-box .stat-value{
    font-size:19px;
    font-weight:700;
  }
  .stat-box.emphasis .stat-value{ color:var(--accent); }
  .stat-note{
    font-size:12.5px;
    color:var(--text-faint);
    margin:-12px 0 24px;
  }

  .section-label{
    font-size:13px;
    font-weight:700;
    color:var(--text-muted);
    margin:0 0 12px;
  }

  /* ---------- Timeline ---------- */
  .timeline{
    margin-bottom:8px;
  }
  .tl-entry{
    display:flex;
    gap:14px;
  }
  .tl-rail{
    width:16px;
    flex-shrink:0;
    display:flex;
    justify-content:center;
  }
  .tl-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--accent);
    margin-top:6px;
  }
  .tl-content{
    flex:1;
    padding:2px 0 16px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .tl-date{
    font-size:14px;
    font-weight:700;
  }
  .tl-memo{
    font-size:13px;
    color:var(--text-muted);
    margin-top:3px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .tl-actions{
    display:flex;
    gap:2px;
    flex-shrink:0;
  }
  .tl-gap{
    display:flex;
    gap:14px;
  }
  .tl-gap .tl-rail{
    position:relative;
  }
  .tl-gap .tl-line{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:2px;
    background:var(--border-strong);
    transform:translateX(-50%);
  }
  .tl-gap-text{
    font-size:12.5px;
    color:var(--text-faint);
    padding:6px 0;
  }
  .tl-first-note{
    font-size:12px;
    color:var(--text-faint);
    padding:0 0 4px 30px;
  }

  .danger-zone{
    margin-top:36px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }

  /* ---------- Dialogs ---------- */
  dialog{
    border:none;
    border-radius:var(--radius);
    padding:0;
    box-shadow:0 8px 30px rgba(0,0,0,0.15);
    width:min(420px, calc(100vw - 40px));
  }
  dialog::backdrop{
    background:rgba(20,20,18,0.35);
  }
  .dialog-body{
    padding:22px;
  }
  .dialog-body h3{
    margin:0 0 16px;
    font-size:16px;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:5px;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    background:var(--surface);
    color:var(--text);
  }
  .field textarea{
    resize:vertical;
    min-height:60px;
  }
  .dialog-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }

  @media (max-width:640px){
    .app{ padding:16px 16px 60px; }
  }
  @media (max-width:520px){
    .elapsed-num{ font-size:38px; }
    .toolbar{ align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="toolbar" id="toolbar"></div>
  <div id="view"></div>
  <input type="file" id="restoreFileInput" accept=".json,application/json" hidden>
</div>

<dialog id="itemDialog">
  <form class="dialog-body" id="itemForm">
    <h3 id="itemDialogTitle">項目を追加</h3>
    <div class="field">
      <label for="itemNameInput">項目名</label>
      <input type="text" id="itemNameInput" required maxlength="60" placeholder="例: 散髪">
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close-dialog="itemDialog">キャンセル</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="recordDialog">
  <form class="dialog-body" id="recordForm">
    <h3 id="recordDialogTitle">今回を記録</h3>
    <div class="field">
      <label for="recordDateInput">実施日</label>
      <input type="date" id="recordDateInput" required>
    </div>
    <div class="field">
      <label for="recordMemoInput">簡易メモ（任意）</label>
      <textarea id="recordMemoInput" maxlength="200" placeholder="気づいたことなど"></textarea>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close-dialog="recordDialog">キャンセル</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "isince.data.v1";
  var BACKUP_APP_NAME = "iSince";
  var BACKUP_VERSION = 1;
  var SUPPORTED_BACKUP_VERSIONS = [1];
  var SUPPORTED_DATA_VERSIONS = [1];
  // Matches every ID this app generates: crypto.randomUUID() and the
  // "id-<base36>-<base36>" fallback in uid() below are both hyphenated
  // alphanumerics. Restored IDs land in data-id/data-record-id HTML
  // attributes, so this also blocks quote/markup characters from a
  // tampered or hand-crafted backup file.
  var ID_PATTERN = /^[A-Za-z0-9-]+$/;

  /* ---------------- Data layer ---------------- */

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function loadData(){
    var raw;
    try{
      raw = localStorage.getItem(STORAGE_KEY);
    }catch(e){
      raw = null;
    }
    if (!raw) return { version: 1, items: [] };
    try{
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.items)){
        return { version: 1, items: [] };
      }
      parsed.version = parsed.version || 1;
      return parsed;
    }catch(e){
      return { version: 1, items: [] };
    }
  }

  // Never fails silently: a failed write means the user's edit only exists
  // on screen, so they have to be told rather than left to lose it later.
  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      return true;
    }catch(e){
      console.error("failed to save data", e);
      window.alert(
        "データの保存に失敗しました。\n" +
        "直前の操作は保存されていません。\n" +
        "ブラウザの空き容量やプライベートモードの設定をご確認ください。"
      );
      return false;
    }
  }

  var db = loadData();

  var state = {
    view: "list",          // "list" | "detail"
    currentItemId: null,
    sortMode: "elapsed_desc" // "elapsed_desc" | "recent_desc" | "name_asc"
  };

  // Which item/record the open dialog is editing (null = adding a new one).
  var editingItemId = null;
  var pendingRecord = { itemId: null, recordId: null };

  function byId(id){
    return document.getElementById(id);
  }

  function findItem(itemId){
    return db.items.find(function(i){ return i.id === itemId; });
  }

  function findRecord(item, recordId){
    return item.records.find(function(r){ return r.id === recordId; });
  }

  /* ---------------- Date helpers ---------------- */

  function todayStr(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function toUTCms(dateStr){
    var parts = dateStr.split("-");
    return Date.UTC(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }

  function daysBetween(fromStr, toStr){
    return Math.round((toUTCms(toStr) - toUTCms(fromStr)) / 86400000);
  }

  function formatDateDisplay(dateStr){
    var parts = dateStr.split("-");
    return parts[0] + "/" + parts[1] + "/" + parts[2];
  }

  function formatDays(n){
    if (Number.isInteger(n)) return n + "日";
    return (Math.round(n * 10) / 10) + "日";
  }

  function isValidDateStr(s){
    if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var parts = s.split("-");
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    if (m < 1 || m > 12 || d < 1 || d > 31) return false;
    var dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }

  function pad2(n){
    return String(n).padStart(2, "0");
  }

  /* ---------------- Stats ---------------- */

  function computeStats(item){
    var records = item.records.slice().sort(function(a, b){
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    if (records.length === 0){
      return { hasRecords: false, records: records };
    }
    var last = records[records.length - 1];
    var elapsedDays = daysBetween(last.date, todayStr());

    var intervals = [];
    for (var i = 1; i < records.length; i++){
      intervals.push(daysBetween(records[i - 1].date, records[i].date));
    }

    var avg = null, median = null, min = null, max = null;
    if (intervals.length > 0){
      var sum = intervals.reduce(function(a, b){ return a + b; }, 0);
      avg = sum / intervals.length;

      var sorted = intervals.slice().sort(function(a, b){ return a - b; });
      var mid = Math.floor(sorted.length / 2);
      median = sorted.length % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];

      min = Math.min.apply(null, intervals);
      max = Math.max.apply(null, intervals);
    }

    return {
      hasRecords: true,
      records: records,
      lastDate: last.date,
      lastMemo: last.memo,
      elapsedDays: elapsedDays,
      intervalCount: intervals.length,
      avg: avg,
      median: median,
      min: min,
      max: max
    };
  }

  /* ---------------- Backup / Restore ---------------- */

  function totalRecordCount(){
    return db.items.reduce(function(sum, item){ return sum + item.records.length; }, 0);
  }

  function isoStringWithOffset(date){
    var offsetMin = -date.getTimezoneOffset();
    var sign = offsetMin >= 0 ? "+" : "-";
    var abs = Math.abs(offsetMin);
    return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate()) +
      "T" + pad2(date.getHours()) + ":" + pad2(date.getMinutes()) + ":" + pad2(date.getSeconds()) +
      sign + pad2(Math.floor(abs / 60)) + ":" + pad2(abs % 60);
  }

  function backupFilename(date){
    return "iSince-backup-" + date.getFullYear() + pad2(date.getMonth() + 1) + pad2(date.getDate()) + ".json";
  }

  function exportBackup(){
    var now = new Date();
    var payload = {
      app: BACKUP_APP_NAME,
      backupVersion: BACKUP_VERSION,
      exportedAt: isoStringWithOffset(now),
      data: {
        version: db.version || 1,
        items: db.items
      }
    };
    var json = JSON.stringify(payload, null, 2);
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = backupFilename(now);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // Validates a parsed backup object and, when valid, returns a normalized
  // { version, items } data payload ready to replace the current database.
  function validateBackup(obj){
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return { ok: false, reason: "root" };
    if (obj.app !== BACKUP_APP_NAME) return { ok: false, reason: "app" };
    if (typeof obj.backupVersion !== "number" || SUPPORTED_BACKUP_VERSIONS.indexOf(obj.backupVersion) === -1){
      return { ok: false, reason: "backupVersion" };
    }
    var data = obj.data;
    if (!data || typeof data !== "object" || Array.isArray(data)) return { ok: false, reason: "data" };
    if (typeof data.version !== "number" || SUPPORTED_DATA_VERSIONS.indexOf(data.version) === -1){
      return { ok: false, reason: "dataVersion" };
    }
    if (!Array.isArray(data.items)) return { ok: false, reason: "items" };

    var items = [];
    var seenItemIds = new Set();
    for (var i = 0; i < data.items.length; i++){
      var item = data.items[i];
      if (!item || typeof item !== "object" || Array.isArray(item)) return { ok: false, reason: "item" };
      if (typeof item.id !== "string" || !ID_PATTERN.test(item.id)) return { ok: false, reason: "itemId" };
      if (seenItemIds.has(item.id)) return { ok: false, reason: "itemIdDuplicate" };
      seenItemIds.add(item.id);
      var itemName = typeof item.name === "string" ? item.name.trim() : "";
      if (!itemName) return { ok: false, reason: "itemName" };
      if (!Array.isArray(item.records)) return { ok: false, reason: "records" };

      var records = [];
      var seenRecordIds = new Set();
      for (var j = 0; j < item.records.length; j++){
        var rec = item.records[j];
        if (!rec || typeof rec !== "object" || Array.isArray(rec)) return { ok: false, reason: "record" };
        if (typeof rec.id !== "string" || !ID_PATTERN.test(rec.id)) return { ok: false, reason: "recordId" };
        if (seenRecordIds.has(rec.id)) return { ok: false, reason: "recordIdDuplicate" };
        seenRecordIds.add(rec.id);
        if (!isValidDateStr(rec.date)) return { ok: false, reason: "recordDate" };
        if (rec.memo !== undefined && rec.memo !== null && typeof rec.memo !== "string") return { ok: false, reason: "recordMemo" };
        records.push({ id: rec.id, date: rec.date, memo: typeof rec.memo === "string" ? rec.memo : "" });
      }
      items.push({ id: item.id, name: itemName, records: records });
    }

    return { ok: true, data: { version: data.version, items: items } };
  }

  function restoreErrorMessage(reason){
    var messages = {
      parse: "ファイルをJSONとして読み込めませんでした。正しいiSinceのバックアップファイル（.json）を選択してください。",
      root: "バックアップファイルの形式が正しくありません。",
      app: "このファイルはiSinceのバックアップファイルではありません。",
      backupVersion: "このバックアップファイルのバージョンには対応していません。",
      data: "バックアップファイルにデータが含まれていません。",
      dataVersion: "このバックアップデータの形式には対応していません。",
      items: "バックアップデータの項目一覧の形式が正しくありません。",
      item: "バックアップデータの項目の形式が正しくありません。",
      itemId: "バックアップデータの項目IDの形式が正しくありません。",
      itemIdDuplicate: "バックアップデータの項目IDが重複しています。",
      itemName: "バックアップデータの項目名の形式が正しくありません。",
      records: "バックアップデータの記録一覧の形式が正しくありません。",
      record: "バックアップデータの記録の形式が正しくありません。",
      recordId: "バックアップデータの記録IDの形式が正しくありません。",
      recordIdDuplicate: "バックアップデータの記録IDが同一項目内で重複しています。",
      recordDate: "バックアップデータの記録の日付が正しくありません。",
      recordMemo: "バックアップデータの記録メモの形式が正しくありません。"
    };
    return "復元に失敗しました。\n" + (messages[reason] || "不明なエラーが発生しました。") +
      "\n現在のデータは変更されていません。";
  }

  function triggerRestore(){
    var input = document.getElementById("restoreFileInput");
    input.value = ""; // allow re-selecting the same file next time
    input.click();
  }

  function handleRestoreFileChange(file){
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{
        parsed = JSON.parse(String(reader.result));
      }catch(err){
        alert(restoreErrorMessage("parse"));
        return;
      }
      var result = validateBackup(parsed);
      if (!result.ok){
        alert(restoreErrorMessage(result.reason));
        return;
      }
      confirmAndRestore(result.data);
    };
    reader.onerror = function(){
      alert("バックアップファイルの読み込みに失敗しました。\n現在のデータは変更されていません。");
    };
    reader.readAsText(file);
  }

  function confirmAndRestore(data){
    var currentItemCount = db.items.length;
    var currentRecordCount = totalRecordCount();
    var msg =
      "バックアップから復元します。\n\n" +
      "現在の\n" +
      currentItemCount + "項目・" + currentRecordCount + "件の記録\n" +
      "はバックアップの内容に置き換えられます。\n\n" +
      "この操作は元に戻せません。\n" +
      "復元前に必要であれば現在のデータをバックアップしてください。";
    if (!window.confirm(msg)) return;
    performRestore(data);
  }

  function performRestore(data){
    var previous = db;
    db = { version: data.version, items: data.items };
    if (!saveData()){
      // saveData already reported the failure; put the old data back so
      // what is on screen matches what is actually stored.
      db = previous;
      renderApp();
      return;
    }
    state.view = "list";
    state.currentItemId = null;
    renderApp();
  }

  /* ---------------- Rendering: toolbar ---------------- */

  function renderToolbar(){
    var toolbar = document.getElementById("toolbar");
    if (state.view === "detail"){
      toolbar.innerHTML = "";
      return;
    }
    var hasItems = db.items.length > 0;
    var html = "";
    html += '<div class="brand">iSince</div>';
    html += '<div class="toolbar-controls">';
    if (hasItems){
      html += '<select id="sortSelect">';
      html += '<option value="elapsed_desc"' + (state.sortMode === "elapsed_desc" ? " selected" : "") + '>経過日数が長い順</option>';
      html += '<option value="recent_desc"' + (state.sortMode === "recent_desc" ? " selected" : "") + '>最近記録した順</option>';
      html += '<option value="name_asc"' + (state.sortMode === "name_asc" ? " selected" : "") + '>名前順</option>';
      html += '</select>';
    }
    html += '<div class="backup-restore-group">';
    html += '<button type="button" class="btn-text" data-action="backup" title="現在のデータをJSONファイルとして保存します">バックアップ</button>';
    html += '<button type="button" class="btn-text" data-action="restore" title="JSONファイルから復元します">復元</button>';
    html += '</div>';
    html += '<span class="toolbar-divider" aria-hidden="true"></span>';
    html += '<button class="btn btn-primary" data-action="add-item">＋ 項目を追加</button>';
    html += '</div>';
    toolbar.innerHTML = html;
  }

  /* ---------------- Rendering: list view ---------------- */

  function sortedItems(){
    // Work out each item's sort values once up front. Calling computeStats()
    // from inside a comparator would re-sort that item's records on every
    // single comparison.
    var entries = db.items.map(function(item){
      var stats = computeStats(item);
      return {
        item: item,
        elapsedDays: stats.hasRecords ? stats.elapsedDays : null,
        lastDate: stats.hasRecords ? stats.lastDate : null
      };
    });

    function byName(a, b){
      return a.item.name.localeCompare(b.item.name, "ja");
    }

    // Items with no records have nothing to sort on, so they go to the end
    // and fall back to name order among themselves.
    function nullsLast(key, compare){
      return function(a, b){
        if (a[key] === null && b[key] === null) return byName(a, b);
        if (a[key] === null) return 1;
        if (b[key] === null) return -1;
        return compare(a[key], b[key]);
      };
    }

    if (state.sortMode === "name_asc"){
      entries.sort(byName);
    } else if (state.sortMode === "recent_desc"){
      entries.sort(nullsLast("lastDate", function(a, b){
        return a < b ? 1 : a > b ? -1 : 0;
      }));
    } else {
      entries.sort(nullsLast("elapsedDays", function(a, b){ return b - a; }));
    }

    return entries.map(function(entry){ return entry.item; });
  }

  function renderCard(item){
    var stats = computeStats(item);
    var html = '<article class="card" data-action="open-detail" data-id="' + item.id + '">';
    html += '<h3 class="card-name">' + escapeHtml(item.name) + '</h3>';

    html += '<div class="card-main">';
    if (!stats.hasRecords){
      html += '<div class="elapsed-empty">記録がありません</div>';
    } else {
      html += '<div class="elapsed-num">' + stats.elapsedDays + '<span class="unit">日</span></div>';
      html += '<div class="elapsed-label">経過</div>';
      if (stats.avg !== null){
        var diff = Math.round(stats.elapsedDays - stats.avg);
        if (diff > 0){
          html += '<div class="compare-text">いつもより' + diff + '日長め</div>';
        }
      }
    }
    html += '</div>';

    if (stats.hasRecords){
      html += '<div class="card-meta">';
      html += '<div>前回　' + formatDateDisplay(stats.lastDate) + '</div>';
      if (stats.avg !== null){
        html += '<div>通常　約' + Math.round(stats.avg) + '日間隔</div>';
      }
      if (stats.lastMemo){
        html += '<div class="card-memo">メモ　' + escapeHtml(stats.lastMemo) + '</div>';
      }
      html += '</div>';
    }

    html += '<button class="record-btn" data-action="quick-record" data-id="' + item.id + '">＋ 今回を記録</button>';
    html += '</article>';
    return html;
  }

  function renderList(){
    var view = document.getElementById("view");
    if (db.items.length === 0){
      view.innerHTML =
        '<div class="empty-state">' +
        '<h2>まだ記録項目がありません</h2>' +
        '<p>「散髪」「洗車」など、\n前回いつ行ったか確認したいものを登録できます。</p>' +
        '<button class="btn btn-primary" data-action="add-item">最初の項目を追加</button>' +
        '</div>';
      return;
    }
    var items = sortedItems();
    var html = '<div class="cards">';
    items.forEach(function(item){
      html += renderCard(item);
    });
    html += '</div>';
    view.innerHTML = html;
  }

  /* ---------------- Rendering: detail view ---------------- */

  function renderTimeline(stats){
    if (!stats.hasRecords) return "";
    var records = stats.records.slice().reverse(); // newest first
    var html = '<div class="timeline">';
    records.forEach(function(rec, idx){
      html += '<div class="tl-entry">';
      html += '<div class="tl-rail"><span class="tl-dot"></span></div>';
      html += '<div class="tl-content">';
      html += '<div><div class="tl-date">' + formatDateDisplay(rec.date) + '</div>';
      if (rec.memo){
        html += '<div class="tl-memo">' + escapeHtml(rec.memo) + '</div>';
      }
      html += '</div>';
      html += '<div class="tl-actions">';
      html += '<button class="btn-text" data-action="edit-record" data-id="' + state.currentItemId + '" data-record-id="' + rec.id + '">編集</button>';
      html += '<button class="btn-danger-text" data-action="delete-record" data-id="' + state.currentItemId + '" data-record-id="' + rec.id + '">削除</button>';
      html += '</div>';
      html += '</div>'; // tl-content
      html += '</div>'; // tl-entry

      var isLast = idx === records.length - 1;
      if (!isLast){
        var older = records[idx + 1];
        var gap = daysBetween(older.date, rec.date);
        html += '<div class="tl-gap">';
        html += '<div class="tl-rail"><span class="tl-line"></span></div>';
        html += '<div class="tl-gap-text">' + formatDays(gap) + '</div>';
        html += '</div>';
      }
    });
    html += '</div>';
    return html;
  }

  function renderDetail(){
    var view = document.getElementById("view");
    var item = db.items.find(function(i){ return i.id === state.currentItemId; });
    if (!item){
      state.view = "list";
      renderApp();
      return;
    }
    var stats = computeStats(item);

    var html = '<button class="back-link" data-action="back">← 一覧に戻る</button>';
    html += '<div class="detail-header">';
    html += '<div class="detail-title-row">';
    html += '<h2 class="detail-title">' + escapeHtml(item.name) + '</h2>';
    html += '<button class="btn-text" data-action="edit-item" data-id="' + item.id + '">項目名を編集</button>';
    html += '</div>';
    html += '<button class="btn btn-primary" data-action="quick-record" data-id="' + item.id + '">＋ 今回を記録</button>';
    html += '</div>';

    if (!stats.hasRecords){
      html += '<div class="empty-state" style="padding:60px 20px;">';
      html += '<h2>まだ記録がありません</h2>';
      html += '<p>「今回を記録」から最初の記録を追加してください。</p>';
      html += '</div>';
    } else {
      html += '<div class="stat-grid">';
      html += statBox("前回実施日", formatDateDisplay(stats.lastDate), false);
      html += statBox("経過日数", stats.elapsedDays + "日", true);
      if (stats.avg !== null){
        html += statBox("平均間隔", formatDays(stats.avg), false);
        html += statBox("中央値", formatDays(stats.median), false);
        html += statBox("最短間隔", formatDays(stats.min), false);
        html += statBox("最長間隔", formatDays(stats.max), false);
      }
      html += '</div>';

      if (stats.avg !== null){
        var diff = Math.round(stats.elapsedDays - stats.avg);
        var compareText = "";
        if (diff > 0){
          compareText = "いつもの間隔：約" + Math.round(stats.avg) + "日 ／ いつもより" + diff + "日長め";
        } else if (diff < 0){
          compareText = "いつもの間隔：約" + Math.round(stats.avg) + "日 ／ まだ通常間隔内";
        } else {
          compareText = "いつもの間隔：約" + Math.round(stats.avg) + "日";
        }
        html += '<p class="stat-note">' + escapeHtml(compareText) + '</p>';
      } else {
        html += '<p class="stat-note">記録が2件以上になると、間隔の統計が表示されます。</p>';
      }

      html += '<h3 class="section-label">履歴</h3>';
      html += renderTimeline(stats);
    }

    html += '<div class="danger-zone">';
    html += '<button class="btn-danger-text" data-action="delete-item" data-id="' + item.id + '">この項目を削除</button>';
    html += '</div>';

    view.innerHTML = html;
  }

  function statBox(label, value, emphasis){
    return '<div class="stat-box' + (emphasis ? ' emphasis' : '') + '"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(ch){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  /* ---------------- Master render ---------------- */

  function renderApp(){
    renderToolbar();
    if (state.view === "detail"){
      renderDetail();
    } else {
      renderList();
    }
  }

  /* ---------------- Dialog helpers ---------------- */

  // item / record are null when adding a new one.
  function openItemDialog(item){
    editingItemId = item ? item.id : null;
    byId("itemDialogTitle").textContent = item ? "項目名を編集" : "項目を追加";
    var input = byId("itemNameInput");
    input.value = item ? item.name : "";
    byId("itemDialog").showModal();
    input.focus();
  }

  function openRecordDialog(itemId, record){
    pendingRecord.itemId = itemId;
    pendingRecord.recordId = record ? record.id : null;
    byId("recordDialogTitle").textContent = record ? "記録を編集" : "今回を記録";
    var dateInput = byId("recordDateInput");
    // Records are always of something already done, so a future date is a
    // typo. Without this a slip like "2062" shows a huge negative 経過日数.
    dateInput.max = todayStr();
    dateInput.value = record ? record.date : todayStr();
    byId("recordMemoInput").value = record ? (record.memo || "") : "";
    byId("recordDialog").showModal();
    dateInput.focus();
  }

  /* ---------------- Actions ---------------- */

  function openDetail(itemId){
    state.view = "detail";
    state.currentItemId = itemId;
    renderApp();
  }

  function backToList(){
    state.view = "list";
    state.currentItemId = null;
    renderApp();
  }

  function editItemName(itemId){
    var item = findItem(itemId);
    if (item) openItemDialog(item);
  }

  function deleteItem(itemId){
    var item = findItem(itemId);
    if (!item) return;
    var msg = "「" + item.name + "」を削除します。";
    if (item.records.length > 0) msg += "記録" + item.records.length + "件もすべて削除されます。";
    msg += "\nこの操作は取り消せません。よろしいですか？";
    if (!window.confirm(msg)) return;
    db.items = db.items.filter(function(i){ return i.id !== itemId; });
    saveData();
    backToList();
  }

  function editRecord(itemId, recordId){
    var item = findItem(itemId);
    var record = item && findRecord(item, recordId);
    if (record) openRecordDialog(itemId, record);
  }

  function deleteRecord(itemId, recordId){
    var item = findItem(itemId);
    if (!item) return;
    if (!window.confirm("この記録を削除します。よろしいですか？")) return;
    item.records = item.records.filter(function(r){ return r.id !== recordId; });
    saveData();
    renderApp();
  }

  /* ---------------- Event handling ---------------- */

  // One delegated listener for the whole app. closest() picks the innermost
  // [data-action], so a button inside a card wins over the card itself.
  byId("app").addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    var recordId = el.getAttribute("data-record-id");

    if (action === "add-item"){
      openItemDialog(null);
    } else if (action === "backup"){
      exportBackup();
    } else if (action === "restore"){
      triggerRestore();
    } else if (action === "open-detail"){
      openDetail(id);
    } else if (action === "back"){
      backToList();
    } else if (action === "quick-record"){
      openRecordDialog(id, null);
    } else if (action === "edit-item"){
      editItemName(id);
    } else if (action === "delete-item"){
      deleteItem(id);
    } else if (action === "edit-record"){
      editRecord(id, recordId);
    } else if (action === "delete-record"){
      deleteRecord(id, recordId);
    }
  });

  byId("app").addEventListener("change", function(e){
    if (e.target.id === "sortSelect"){
      state.sortMode = e.target.value;
      renderApp();
    } else if (e.target.id === "restoreFileInput"){
      handleRestoreFileChange(e.target.files && e.target.files[0]);
    }
  });

  byId("itemForm").addEventListener("submit", function(e){
    e.preventDefault();
    var input = byId("itemNameInput");
    // Trim before validating, so a name of only spaces trips the browser's
    // own "required" message instead of silently doing nothing.
    input.value = input.value.trim();
    if (!input.reportValidity()) return;

    if (editingItemId){
      var item = findItem(editingItemId);
      if (item) item.name = input.value;
    } else {
      db.items.push({ id: uid(), name: input.value, records: [] });
    }
    saveData();
    byId("itemDialog").close();
    renderApp();
  });

  byId("recordForm").addEventListener("submit", function(e){
    e.preventDefault();
    var date = byId("recordDateInput").value;
    var memo = byId("recordMemoInput").value.trim();
    var item = findItem(pendingRecord.itemId);
    if (!date || !item) return;

    if (pendingRecord.recordId){
      var record = findRecord(item, pendingRecord.recordId);
      if (record){ record.date = date; record.memo = memo; }
    } else {
      item.records.push({ id: uid(), date: date, memo: memo });
    }
    saveData();
    byId("recordDialog").close();
    renderApp();
  });

  document.querySelectorAll("[data-close-dialog]").forEach(function(btn){
    btn.addEventListener("click", function(){
      byId(btn.getAttribute("data-close-dialog")).close();
    });
  });

  /* ---------------- Init ---------------- */

  renderApp();
})();
</script>
</body>
</html>
